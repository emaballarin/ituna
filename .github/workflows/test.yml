name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # the project targets the current Python and requires it
                python-version: ["3.14"]
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Check formatting
              run: ruff format --check .

            - name: Lint
              run: ruff check .

            - name: Run the suite
              run: pytest tests/ -v

    parity:
        name: Upstream parity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  # the check materialises an upstream tree from local history
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Compare against upstream on the scoring path
              run: python tools/upstream_parity/compare.py
